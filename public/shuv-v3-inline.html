<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F4EC"><meta name="robots" content="noindex,nofollow"><title>Shuv Flow</title><style>:root{--bg:#F7F4EC;--ink:#243126;--green:#4F6841;--sage:#DDE5D7;--line:#D5DCCF;--muted:#7A8578;--red:#A86860;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}body{background-image:radial-gradient(#4f684112 1px,transparent 1px);background-size:20px 20px}.auth{max-width:500px;margin:8vh auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px}.logo{width:155px;height:75px;object-fit:contain}h1{font-size:40px;line-height:1.05}.muted{color:var(--muted);line-height:1.5}.stack{display:grid;gap:12px}.btn,.ghost{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:16px;text-decoration:none;font-weight:700}.btn{background:var(--ink);color:#fff}.ghost{border:1px solid var(--green);color:var(--green);background:#fff}</style></head><body><div id="app"></div><script>const app=document.getElementById('app');const LOGO='https://inmftuoucmdypbautxaj.supabase.co/functions/v1/shuv-v2/logo';function show(){app.innerHTML='<main class="auth"><section class="card"><img class="logo" src="'+LOGO+'" alt="Shuv Flow"><h1>מחזירים פניות לשיחה, בלי לרדוף אחריהן.</h1><p class="muted">מעלים את הפניות שלא נסגרו. Shuv Flow עוזר להבין למי שווה לחזור, מתי ולמה.</p><div class="stack"><a class="btn" href="#start">פתיחת פיילוט</a><a class="ghost" href="#login">כבר יש לי חשבון</a></div></section></main>'}show();</script></body></html>
