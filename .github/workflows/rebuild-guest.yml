name: Verify guest-first rebuild
on:
  push:
    branches: [recovery/product-2026-09-05]
    paths:
      - '.github/workflows/rebuild-guest.yml'
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'e2e/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: shuvflow-guest-rebuild
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned Scroll Craft source
        run: |
          printf '%s\n' '9246fbe4e240a63cdaf33111edd724ee66118da87dc44af86039b0d1619164a1  public/vendor/scrollcraft.js' 'e19eb3aa73b0944626ca56e6e427c76f44753481e04d60f4bac20e8cf1d7758a  public/vendor/scrollcraft.css' 'dd471a27eca72488a53e6ea6fbe9392d81aa3f01e950e63fe328affb2ddfa6e3  public/vendor/scrollcraft-LICENSE.txt' | sha256sum -c -
      - run: npm ci --no-audit --no-fund
      - name: Type check and unit tests
        run: |
          mkdir -p qa
          set -o pipefail
          npm run typecheck 2>&1 | tee qa/typecheck.log
          npm test 2>&1 | tee qa/unit-tests.log
      - name: Build production export
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee qa/build.log
      - name: Install pinned browser verification tools
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start real HTTP origin
        id: server
        run: |
          python -m http.server 3080 --bind 127.0.0.1 --directory out > /tmp/shuvflow-http.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:3080/ > /dev/null && break; sleep 1; done
      - name: Verify desktop, phone and reduced motion in a browser
        if: success() && steps.server.outcome == 'success'
        run: python e2e/visual.py
      - name: Complete guest journey with real storage and clipboard
        if: (success() || failure()) && steps.server.outcome == 'success'
        run: python e2e/journey.py
      - name: Record exact tested revision
        if: always()
        run: |
          mkdir -p qa
          git rev-parse HEAD > qa/tested-commit.txt
          cp /tmp/shuvflow-http.log qa/http.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-rebuild-proof
          path: qa/
          retention-days: 7
