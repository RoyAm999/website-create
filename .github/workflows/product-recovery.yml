name: Product recovery verification
on:
  push:
    branches: [recovery/product-2026-09-05]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: product-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Export reviewed source
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-source
          path: source.zip
          retention-days: 3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check optional deployment credential availability
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: echo "Configured Vercel deploy credential available = $HAS_VERCEL_TOKEN"
