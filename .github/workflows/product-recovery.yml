name: Product recovery source archive
on:
  push:
    branches: [recovery/product-2026-09-05]
    paths: ['.github/workflows/product-recovery.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source without dependencies or credentials
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-source
          path: source.zip
          retention-days: 3
